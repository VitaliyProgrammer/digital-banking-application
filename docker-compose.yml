# Infrastructure only:          docker compose up -d                 (run the bank itself from the IDE)
# The whole bank in containers:  docker compose --profile app up -d --build
services:

  app:
    profiles: [app]
    build: .
    image: digital-banking:local
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_started }
    environment:
      # Inside the compose network every service is reached by its name, not by localhost.
      DB_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      MAIL_HOST: mailpit
      # Optional: the first admin, e.g. ADMIN_EMAIL=admin@bank.local ADMIN_PASSWORD=... in a local .env file.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 1g

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-digital_bank}
      POSTGRES_USER: ${DB_USERNAME:-bank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bank}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Message broker for the bank's events. Management UI: http://localhost:15672 (guest / guest).
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Fake mail server: catches every email the bank sends. Web UI with the received emails: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "8025:8025"

volumes:
  postgres-data:
