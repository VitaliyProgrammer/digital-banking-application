spring:
  application:
    name: digital-banking

  # Defaults after ":" are for local development only (docker-compose.yml).
  # Any other environment passes real values via environment variables.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digital_bank}
    username: ${DB_USERNAME:bank}
    password: ${DB_PASSWORD:bank}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    # Do not keep a DB connection open for the whole HTTP request.
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  threads:
    virtual:
      enabled: true

banking:
  security:
    jwt:
      issuer: digital-banking
      # Local development only. Every other environment must set JWT_SECRET (32+ characters).
      secret: ${JWT_SECRET:local-dev-secret-do-not-use-in-production}
      access-token-ttl: 15m
      refresh-token-ttl: 30d

  # Four separate 256-bit keys (Base64), one per purpose: leaking one does not compromise the others.
  # Local development only. Every other environment must set them via environment variables.
  card:
    encryption-key: ${CARD_ENCRYPTION_KEY:DOIhXhXO0ORRUcBHdRSrDoVRa9YFnf27QIWHU0qSqE0=}
    lookup-key: ${CARD_LOOKUP_KEY:ykr5RHwq1+Rl+u2I+erJISG/md3brl+iFX9CzMVslkg=}
    cvv-key: ${CARD_CVV_KEY:M/AZdWcPUKcf4EhywxnnPaO7mDEcMsKAHSwkuph+Vak=}
    pin-key: ${CARD_PIN_KEY:xfoThHlDLMKzOEN1t9mSSfdh+8+EjhIOtGzokIsVZQM=}

  providers:
    # Locally the bank calls its own fake providers (/mock-providers) over real HTTP.
    base-url: ${PROVIDERS_BASE_URL:http://localhost:${server.port:8080}/mock-providers}
    connect-timeout: 2s
    read-timeout: 3s
    mock-enabled: ${PROVIDERS_MOCK_ENABLED:true}

  bill-payments:
    worker-enabled: true
    processing-delay: 2s
    reconciliation-delay: 10s
    lease: 30s
    batch-size: 20
    max-delivery-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
