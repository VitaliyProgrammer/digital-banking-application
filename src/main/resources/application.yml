spring:
  application:
    name: digital-banking

  # Defaults after ":" are for local development only (docker-compose.yml).
  # Any other environment passes real values via environment variables.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digital_bank}
    username: ${DB_USERNAME:bank}
    password: ${DB_PASSWORD:bank}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Locally: Mailpit from docker-compose.yml catches every email; see them at http://localhost:8025.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # Without timeouts a hanging mail server would hang the HTTP request forever.
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  jpa:
    # Do not keep a DB connection open for the whole HTTP request.
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  threads:
    virtual:
      enabled: true

banking:
  security:
    jwt:
      issuer: digital-banking
      # Local development only. Every other environment must set JWT_SECRET (32+ characters).
      secret: ${JWT_SECRET:local-dev-secret-do-not-use-in-production}
      access-token-ttl: 15m
      refresh-token-ttl: 30d

  # Four separate 256-bit keys (Base64), one per purpose: leaking one does not compromise the others.
  # Local development only. Every other environment must set them via environment variables.
  card:
    encryption-key: ${CARD_ENCRYPTION_KEY:DOIhXhXO0ORRUcBHdRSrDoVRa9YFnf27QIWHU0qSqE0=}
    lookup-key: ${CARD_LOOKUP_KEY:ykr5RHwq1+Rl+u2I+erJISG/md3brl+iFX9CzMVslkg=}
    cvv-key: ${CARD_CVV_KEY:M/AZdWcPUKcf4EhywxnnPaO7mDEcMsKAHSwkuph+Vak=}
    pin-key: ${CARD_PIN_KEY:xfoThHlDLMKzOEN1t9mSSfdh+8+EjhIOtGzokIsVZQM=}

  providers:
    # Locally the bank calls its own fake providers (/mock-providers) over real HTTP.
    base-url: ${PROVIDERS_BASE_URL:http://localhost:${server.port:8080}/mock-providers}
    connect-timeout: 2s
    read-timeout: 3s
    mock-enabled: ${PROVIDERS_MOCK_ENABLED:true}

  bill-payments:
    worker-enabled: true
    processing-delay: 2s
    reconciliation-delay: 10s
    lease: 30s
    batch-size: 20
    max-delivery-attempts: 5

  exchange-rates:
    nbu-url: ${NBU_RATES_URL:https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json}
    connect-timeout: 3s
    read-timeout: 5s
    sync-enabled: ${EXCHANGE_RATES_SYNC_ENABLED:true}
    # Every hour at :05 Kyiv time. A day already stored is skipped, so extra runs only act as retries.
    sync-cron: "0 5 * * * *"
    default-spread-percent: 1.50
    max-manual-deviation-percent: 10.00
    quote-ttl: 30s

  receipts:
    mail-from: ${RECEIPTS_MAIL_FROM:Digital Bank <no-reply@digital-bank.local>}

  # First admin, created on startup. No defaults on purpose: without these variables there is no admin.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # A mail server that is down must not mark the whole bank as DOWN: payments still work without email.
    mail:
      enabled: false
