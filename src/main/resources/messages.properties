# English texts of the API that are not inside an exception: the handler's own messages and validation rules.
# A business error keeps its English text in its exception, next to the reason for it; messages_uk.properties
# translates it by code. Spring's own errors (bad JSON, a missing header) already have English defaults.

request.validation-failed=Request validation failed
error.unexpected=Unexpected error. Please try again later.

validation.ten-digits=must be 10 digits
validation.kved=must look like 62.01
validation.four-digits=must be 4 digits
validation.provider-account=may contain only digits, letters, '+' and '-'
