# Ukrainian texts of the API, chosen by the Accept-Language header (uk, uk-UA, ...).
# error.<code>: a business error; the code is the one the exception carries, and the English text sits in that
# exception. {0}, {1}: values of the error, formatted the Ukrainian way (1 234,50).
# The apostrophe is the Ukrainian letter ʼ (U+02BC), not the ASCII ', which MessageFormat would treat as a quote.

