<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taborovets Universal Bank — demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Texts come from i18n.js: data-i18n sets the content, data-i18n-title / -placeholder set those attributes. -->

<!-- ===== Before login: one screen, the bank on the left, one form on the right ===== -->
<section id="auth" class="auth-screen">
    <div class="auth-brand">
        <div class="logo">🏦</div>
        <h1>Taborovets Universal Bank</h1>
        <p class="tagline" data-i18n="auth.tagline"></p>
        <ul class="features">
            <li><span>💳</span><span class="text" data-i18n="auth.feature.ledger"></span></li>
            <li><span>🧾</span><span class="text" data-i18n="auth.feature.bills"></span></li>
            <li><span>💱</span><span class="text" data-i18n="auth.feature.exchange"></span></li>
            <li><span>⚡</span><span class="text" data-i18n="auth.feature.log"></span></li>
        </ul>
        <p class="admin-hint" data-i18n="auth.adminHint"></p>
    </div>

    <div class="auth-panel">
        <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-lang="uk" onclick="setLang('uk')">УКР</button>
            <button type="button" data-lang="en" onclick="setLang('en')">ENG</button>
        </div>
        <div class="auth-card">
            <div class="tabs" role="tablist">
                <button type="button" role="tab" id="tabLogin" onclick="showAuth('login')" data-i18n="auth.tab.login"></button>
                <button type="button" role="tab" id="tabRegister" onclick="showAuth('register')" data-i18n="auth.tab.register"></button>
            </div>

            <!-- Real forms with autocomplete hints: the browser's password manager suggests a strong password on
                 registration, offers to save it, and fills the login next time. -->
            <form id="loginForm" onsubmit="login(event)">
                <div id="rememberedAs" class="remembered" hidden>
                    <span data-i18n="auth.welcomeBack"></span> <b id="rememberedEmail"></b> · <a href="#" onclick="forgetMe(event)" data-i18n="auth.notYou"></a>
                </div>
                <label for="loginEmail" data-i18n="auth.email"></label>
                <input id="loginEmail" name="email" type="email" autocomplete="username" required>
                <div class="label-row">
                    <label for="loginPassword" data-i18n="auth.password"></label>
                    <a href="#" onclick="showAuth('forgot', event)" data-i18n="auth.forgotLink"></a>
                </div>
                <div class="password-field">
                    <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
                    <button type="button" class="icon" data-i18n-title="auth.showHide" onclick="togglePasswordVisibility('loginPassword')">👁</button>
                </div>
                <label class="check"><input type="checkbox" id="loginRemember"> <span data-i18n="auth.remember"></span></label>
                <button type="submit" class="wide" data-i18n="auth.tab.login"></button>
                <button type="button" class="wide secondary" onclick="fillAdmin()" data-i18n="auth.fillAdmin"></button>
            </form>

            <form id="registerForm" onsubmit="register(event)" hidden>
                <div class="row">
                    <div><label for="regFirst" data-i18n="auth.firstName"></label><input id="regFirst" name="given-name" autocomplete="given-name" value="Olena" required></div>
                    <div><label for="regLast" data-i18n="auth.lastName"></label><input id="regLast" name="family-name" autocomplete="family-name" value="Demo" required></div>
                </div>
                <label for="regEmail" data-i18n="auth.email"></label>
                <input id="regEmail" name="email" type="email" autocomplete="username" required>
                <label for="regPassword" data-i18n="auth.newPassword"></label>
                <div class="password-field">
                    <input id="regPassword" name="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
                    <button type="button" class="icon" data-i18n-title="auth.generate" onclick="fillGeneratedPassword('regPassword')">🎲</button>
                    <button type="button" class="icon" data-i18n-title="auth.showHide" onclick="togglePasswordVisibility('regPassword')">👁</button>
                    <button type="button" class="icon" data-i18n-title="auth.copy" onclick="copyPassword('regPassword', toast)">📋</button>
                </div>
                <p class="hint below" data-i18n="auth.generatedHint"></p>
                <label class="check"><input type="checkbox" id="regRemember" checked> <span data-i18n="auth.remember"></span></label>
                <button type="submit" class="wide" data-i18n="auth.tab.register"></button>
            </form>

            <form id="forgotForm" onsubmit="requestPasswordReset(event)" hidden>
                <h2 data-i18n="auth.forgot.title"></h2>
                <p class="hint" data-i18n="auth.forgot.hint"></p>
                <label for="forgotEmail" data-i18n="auth.email"></label>
                <input id="forgotEmail" name="email" type="email" autocomplete="username" required>
                <button type="submit" class="wide" data-i18n="auth.forgot.send"></button>
                <button type="button" class="wide secondary" onclick="showAuth('login')" data-i18n="auth.forgot.back"></button>
            </form>
        </div>
        <p class="auth-foot"><a href="/swagger-ui.html" target="_blank" data-i18n="auth.swagger"></a> · <a href="http://localhost:8025" target="_blank">Mailpit ↗</a></p>
    </div>
</section>

<!-- ===== After login: top bar, menu, the page, and the API log as a side panel ===== -->
<div id="app" class="app" hidden>
    <header class="topbar">
        <div class="brand">🏦 Taborovets Universal Bank <small>demo</small></div>
        <div class="spacer"></div>
        <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-lang="uk" onclick="setLang('uk')">УКР</button>
            <button type="button" data-lang="en" onclick="setLang('en')">ENG</button>
        </div>
        <button type="button" class="ghost" id="logToggle" onclick="toggleLog()" data-i18n-title="top.logTitle">⚡<span class="label"> API log</span> <span class="pill" id="logCount">0</span></button>
        <span class="bell" data-i18n-title="nav.notifications" onclick="go('notifications')">🔔<span class="count" id="unread" hidden>0</span></span>
        <span class="who" id="who"></span>
        <button type="button" class="ghost" onclick="logout()" data-i18n="top.logout"></button>
    </header>
    <div class="layout" id="layout">
        <nav>
            <a data-view="overview" onclick="go('overview')">🏠 <span data-i18n="nav.overview"></span></a>
            <a data-view="payments" onclick="go('payments')">🔁 <span data-i18n="nav.payments"></span></a>
            <a data-view="bills" onclick="go('bills')">🧾 <span data-i18n="nav.bills"></span></a>
            <a data-view="cards" onclick="go('cards')">💳 <span data-i18n="nav.cards"></span></a>
            <a data-view="exchange" onclick="go('exchange')">💱 <span data-i18n="nav.exchange"></span></a>
            <a data-view="savings" onclick="go('savings')">🐷 <span data-i18n="nav.savings"></span></a>
            <a data-view="business" onclick="go('business')">💼 <span data-i18n="nav.business"></span></a>
            <a data-view="credit" onclick="go('credit')">💳 <span data-i18n="nav.credit"></span></a>
            <a data-view="notifications" onclick="go('notifications')">🔔 <span data-i18n="nav.notifications"></span></a>
            <a data-view="support" onclick="go('support')">🎧 <span data-i18n="nav.support"></span></a>
            <div id="staffNav" hidden>
                <div class="group" data-i18n="nav.staff"></div>
                <a data-view="staffCredit" onclick="go('staffCredit')">👀 <span data-i18n="nav.staffCredit"></span></a>
                <a data-view="staffSupport" onclick="go('staffSupport')">🎧 <span data-i18n="nav.staffSupport"></span></a>
                <a data-view="staffRates" onclick="go('staffRates')" data-admin>💱 <span data-i18n="nav.staffRates"></span></a>
                <a data-view="staffAudit" onclick="go('staffAudit')" data-admin>🕵️ <span data-i18n="nav.staffAudit"></span></a>
            </div>
            <div class="nav-foot"><a href="/swagger-ui.html" target="_blank">Swagger ↗</a><a href="http://localhost:8025" target="_blank">Mailpit ↗</a></div>
        </nav>
        <main id="view"></main>
        <aside id="logPanel">
            <div class="head">
                <div><b>⚡ API log</b><small>time · method · path · status · duration</small></div>
                <button type="button" onclick="clearLog()">clear</button>
                <button type="button" onclick="toggleLog(false)" title="Hide">✕</button>
            </div>
            <div class="entries" id="log"><p class="log-empty">Every call this page makes to the bank shows up here, with the JSON it sent and got back.</p></div>
        </aside>
    </div>
</div>

<div id="toast"></div>
<script src="i18n.js"></script>
<script src="password.js"></script>
<script src="app.js"></script>
</body>
</html>
