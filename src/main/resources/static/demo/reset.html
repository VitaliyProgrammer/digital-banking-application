<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The address of this page holds a secret token: never send it to another site in the Referer header. -->
    <meta name="referrer" content="no-referrer">
    <title>Taborovets Universal Bank — new password</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="auth-screen">
    <div class="auth-brand">
        <div class="logo">🏦</div>
        <h1>Taborovets Universal Bank</h1>
        <p class="tagline" data-i18n="reset.tagline"></p>
    </div>

    <div class="auth-panel">
        <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-lang="uk" onclick="setLang('uk')">УКР</button>
            <button type="button" data-lang="en" onclick="setLang('en')">ENG</button>
        </div>
        <div class="auth-card">
            <form id="resetForm" onsubmit="resetPassword(event)">
                <h2 data-i18n="reset.title"></h2>
                <p class="hint below" data-i18n="reset.sessionsEnd"></p>
                <!-- Lets the password manager save the new password under the right account. -->
                <input id="resetUsername" name="email" type="email" autocomplete="username" hidden>
                <label for="newPassword" data-i18n="reset.newPassword"></label>
                <div class="password-field">
                    <input id="newPassword" name="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
                    <button type="button" class="icon" data-i18n-title="auth.generate" onclick="fillGeneratedPassword('newPassword')">🎲</button>
                    <button type="button" class="icon" data-i18n-title="auth.showHide" onclick="togglePasswordVisibility('newPassword')">👁</button>
                    <button type="button" class="icon" data-i18n-title="auth.copy" onclick="copyPassword('newPassword', showMessage)">📋</button>
                </div>
                <button type="submit" class="wide" id="resetButton" data-i18n="reset.save"></button>
                <p id="resetMessage" class="hint below" hidden></p>
            </form>
        </div>
        <p class="auth-foot"><a href="index.html" data-i18n="reset.back"></a></p>
    </div>
</section>

<script src="i18n.js"></script>
<script src="password.js"></script>
<script>
'use strict';

// Take the token out of the address bar at once: it should not stay in the browser history.
const token = new URLSearchParams(location.search).get('token');
history.replaceState(null, '', location.pathname);

const message = document.getElementById('resetMessage');

/** The last message, kept as a key, so a language switch can say it again in the other language. */
let lastMessage = null;

function showMessage(text, kind = '') {
    message.textContent = text;
    message.className = `hint below ${kind}`;
    message.hidden = false;
}

function showDone() {
    message.innerHTML = '';
    message.append(t('reset.done') + ' ');
    message.append(Object.assign(document.createElement('a'), { href: 'index.html', textContent: t('reset.logIn') }));
    message.className = 'hint below ok';
    message.hidden = false;
}

/** Called by i18n.js after the language changed. */
function onLanguageChanged() {
    if (lastMessage === 'noToken') showMessage(t('reset.noToken'), 'bad');
    if (lastMessage === 'done') showDone();
}

try {
    document.getElementById('resetUsername').value = localStorage.getItem('rememberedEmail') || '';
} catch { /* storage blocked */ }

if (!token) {
    document.getElementById('resetButton').disabled = true;
    lastMessage = 'noToken';
    showMessage(t('reset.noToken'), 'bad');
} else {
    fillGeneratedPassword('newPassword');
}

async function resetPassword(event) {
    event.preventDefault();
    const response = await fetch('/authentication/password-reset/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept-Language': currentLang() },
        body: JSON.stringify({ token, newPassword: document.getElementById('newPassword').value }),
    });
    if (response.ok) {
        document.getElementById('resetButton').disabled = true;
        lastMessage = 'done';
        showDone();
        return;
    }
    lastMessage = null;
    const problem = await response.json().catch(() => ({}));
    showMessage(problem.detail || problem.title || t('reset.error', { status: response.status }), 'bad');
}
</script>
</body>
</html>
