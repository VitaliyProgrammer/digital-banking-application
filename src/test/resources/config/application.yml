# Test-only overrides for every test context. Spring reads classpath:/config/application.yml after
# classpath:/application.yml, so values here win while everything else still comes from the main file.
banking:
  exchange-rates:
    # Tests never call the real NBU: a test that needs rates calls the sync itself against WireMock.
    sync-enabled: false
  savings:
    # The interest jobs run only when a test calls them, for the dates it chooses.
    jobs-enabled: false
  cashback:
    # The payout runs only when a test calls it.
    jobs-enabled: false
  credit-line:
    # The month is closed only when a test calls it, for the day it chooses.
    jobs-enabled: false
  outbox:
    # Events are published only when a test runs the relay.
    relay-enabled: false
  notifications:
    # A test starts the consumer only when it needs it, and sends due emails itself.
    listener-enabled: false
    mailer-enabled: false

spring:
  mail:
    # No mail server in most test contexts: port 1 refuses at once instead of waiting for a timeout.
    # Tests that need real mail (receipts) point this at their own Mailpit container.
    host: localhost
    port: 1
